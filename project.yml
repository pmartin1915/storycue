name: StoryCue

options:
  bundleIdPrefix: dev.pmartin1915
  deploymentTarget:
    iOS: "27.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    ALWAYS_SEARCH_USER_PATHS: NO
    DEVELOPMENT_TEAM: NN8F5WX25R
    # Empty by default. CI passes STORYCUE_DUO_CONDITIONS=DUO_SDK on the xcodebuild command
    # line only when the selected Xcode's iphoneos SDK is >= 27.1 (see .github/workflows).
    # Only the two targets below expand it; passing SWIFT_ACTIVE_COMPILATION_CONDITIONS
    # directly would replace the inherited DEBUG and hit every target.
    STORYCUE_DUO_CONDITIONS: ""

targets:
  StoryCue:
    type: application
    platform: iOS
    sources:
      - StoryCue
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.pmartin1915.storycue
        PRODUCT_NAME: StoryCue
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) $(STORYCUE_DUO_CONDITIONS)"
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "StoryCue AppStore"
    info:
      path: StoryCue/Info.plist
      properties:
        CFBundleDisplayName: StoryCue
        CFBundleIconName: AppIcon
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSCameraUsageDescription: "StoryCue records video of the person you are interviewing. Recordings stay on this phone."
        NSMicrophoneUsageDescription: "StoryCue records the voice of the person you are interviewing. Recordings stay on this phone."
        NSPhotoLibraryAddUsageDescription: "StoryCue saves the clips you choose to export to your Photos library."

  StoryCueTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - StoryCueTests
    dependencies:
      - target: StoryCue
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.pmartin1915.storycue.tests
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/StoryCue.app/StoryCue
        BUNDLE_LOADER: $(TEST_HOST)
    info:
      path: StoryCueTests/Info.plist
      properties:
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"

  StoryCueDuoTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - StoryCueDuoTests
    dependencies:
      - target: StoryCue
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.pmartin1915.storycue.duotests
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/StoryCue.app/StoryCue
        BUNDLE_LOADER: $(TEST_HOST)
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) $(STORYCUE_DUO_CONDITIONS)"
    info:
      path: StoryCueDuoTests/Info.plist
      properties:
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"

schemes:
  StoryCue:
    build:
      targets:
        StoryCue: all
    test:
      targets:
        - StoryCueTests
        - StoryCueDuoTests
    run:
      config: Debug
    archive:
      config: Release
