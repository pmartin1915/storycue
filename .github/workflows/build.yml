name: Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# macOS minutes bill at 10x on a private repo; a stacked push cancels the run it superseded.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & XCTest (iOS Simulator)
    runs-on: macos-27

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # One Xcode for the whole job. Every later step inherits DEVELOPER_DIR, so the SDK
      # probe below and the build cannot disagree about which toolchain they mean.
      - name: Select Xcode
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE_PATH" ]; then echo "No Xcode found"; exit 1; fi
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          echo "DEVELOPER_DIR=$XCODE_PATH/Contents/Developer" >> "$GITHUB_ENV"
          echo "Using: $XCODE_PATH"
          xcodebuild -version
          swift --version

      # Two separate facts, printed separately, because they land on the runner image on
      # different days: (1) does the iphoneos SDK carry the 27.1 headers, (2) does simctl
      # know a Duo device type. Only (1) sets the compile flag.
      - name: Duo SDK gate
        run: |
          SDK_VER=$(xcrun --sdk iphoneos --show-sdk-version)
          case "$SDK_VER" in *.*) ;; *) SDK_VER="$SDK_VER.0" ;; esac
          MAJOR=${SDK_VER%%.*}; REST=${SDK_VER#*.}; MINOR=${REST%%.*}
          if [ "$MAJOR" -gt 27 ] || { [ "$MAJOR" -eq 27 ] && [ "$MINOR" -ge 1 ]; }; then DUO_SDK=1; else DUO_SDK=0; fi
          if xcrun simctl list devicetypes | grep -qi duo; then DUO_SIM=1; else DUO_SIM=0; fi
          {
            echo "## Duo gate"
            echo "- iphoneos SDK version: **$SDK_VER**"
            echo "- Duo SDK headers (>= 27.1): **$([ $DUO_SDK = 1 ] && echo YES || echo NO)** -> compile flag DUO_SDK $([ $DUO_SDK = 1 ] && echo SET || echo NOT SET)"
            echo "- Duo simulator device type present: **$([ $DUO_SIM = 1 ] && echo YES || echo NO)**"
            echo "- A green run with the flag NOT SET is the baseline recorder only; it proves nothing about the Duo path."
          } | tee -a "$GITHUB_STEP_SUMMARY"
          echo "DUO_SDK=$DUO_SDK" >> "$GITHUB_ENV"
          echo "DUO_SIM=$DUO_SIM" >> "$GITHUB_ENV"

      - name: Install XcodeGen
        run: |
          curl -sL https://github.com/yonaskolb/XcodeGen/releases/latest/download/xcodegen.zip -o /tmp/xcodegen.zip
          unzip -q /tmp/xcodegen.zip -d /tmp/xcodegen
          XCODEGEN_BIN=$(find /tmp/xcodegen -name "xcodegen" -type f | head -1)
          sudo cp "$XCODEGEN_BIN" /usr/local/bin/xcodegen
          sudo chmod +x /usr/local/bin/xcodegen
          xcodegen --version

      - name: Generate Xcode project
        run: xcodegen generate

      # Evidence, not decoration: the step fails if a target does not report its conditions.
      - name: Show compilation conditions per target (baseline lane)
        run: |
          set -o pipefail
          for t in StoryCue StoryCueTests StoryCueDuoTests; do
            echo "== $t =="
            xcodebuild -showBuildSettings -project StoryCue.xcodeproj -target "$t" -configuration Debug \
              STORYCUE_DUO_CONDITIONS="" | grep -E 'SWIFT_ACTIVE_COMPILATION_CONDITIONS|STORYCUE_DUO_CONDITIONS'
          done

      # Baseline lane always runs: flag off, so this is the app every iPhone gets today.
      - name: Build & test (baseline, flag off)
        run: |
          set -o pipefail
          xcodebuild test \
            -project StoryCue.xcodeproj \
            -scheme StoryCue \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            -configuration Debug \
            -resultBundlePath "$RUNNER_TEMP/baseline.xcresult" \
            STORYCUE_DUO_CONDITIONS="" \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            | xcbeautify

      # Duo lane runs only when the gate found 27.1 headers. Same project, same scheme,
      # flag on; the StoryCueDuoTests bundle gets the flag, StoryCueTests never does.
      - name: Build & test (Duo, flag on)
        if: env.DUO_SDK == '1'
        run: |
          set -o pipefail
          for t in StoryCue StoryCueTests StoryCueDuoTests; do
            echo "== $t =="
            xcodebuild -showBuildSettings -project StoryCue.xcodeproj -target "$t" -configuration Debug \
              STORYCUE_DUO_CONDITIONS="DUO_SDK" | grep -E 'SWIFT_ACTIVE_COMPILATION_CONDITIONS'
          done
          xcodebuild test \
            -project StoryCue.xcodeproj \
            -scheme StoryCue \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            -configuration Debug \
            -resultBundlePath "$RUNNER_TEMP/duo.xcresult" \
            STORYCUE_DUO_CONDITIONS="DUO_SDK" \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            | xcbeautify

      - name: Upload xcresult bundles
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcresult-${{ github.run_number }}
          path: ${{ runner.temp }}/*.xcresult
          if-no-files-found: ignore
          retention-days: 14
