name: Build & Test

on:
  # PRs only. A push to main re-tested the exact tree its PR had just passed (squash merge),
  # so it was a duplicate run. Code reaches main only through a green PR; docs/state commits
  # go straight to main and compile nothing. workflow_dispatch covers a manual main check.
  pull_request:
    branches: [main]
    paths-ignore: ['docs/**', 'ai/**', '**/*.md']
  workflow_dispatch:

permissions:
  contents: read

# A stacked push cancels the run it superseded (macOS minutes bill at 10x if a repo is private).
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & XCTest (iOS Simulator)
    runs-on: xcode-27

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Xcodes are chosen by channel and SDK, not by folder-name sort: the xcode-27 image
      # rolls out gradually, and `sort -V | tail -1` gave a beta on one run and the release
      # on the next (runs 35759964133 / 35769450879). The baseline lane is always the newest
      # RELEASE Xcode -- the one deploy archives with. The Duo lane uses its own Xcode.
      - name: Select Xcode
        run: |
          source .github/scripts/select-xcode.sh   # sets RELEASE_XCODE / DUO_XCODE here and in $GITHUB_ENV
          sudo xcode-select -s "$RELEASE_XCODE/Contents/Developer"
          echo "DEVELOPER_DIR=$RELEASE_XCODE/Contents/Developer" >> "$GITHUB_ENV"
          echo "Using: $RELEASE_XCODE"
          DEVELOPER_DIR="$RELEASE_XCODE/Contents/Developer" xcodebuild -version

      # Two separate facts, printed separately, because they land on the runner image on
      # different days: (1) does some Xcode carry the 27.1 iphoneos SDK, (2) does that Xcode's
      # simctl know a Duo device type. Only (1) turns the Duo lane on.
      - name: Duo SDK gate
        run: |
          if [ -n "$DUO_XCODE" ]; then DUO_SDK=1; else DUO_SDK=0; fi
          if [ $DUO_SDK = 1 ] && DEVELOPER_DIR="$DUO_XCODE/Contents/Developer" xcrun simctl list devicetypes | grep -qi duo; then DUO_SIM=1; else DUO_SIM=0; fi
          {
            echo "## Duo gate"
            echo "- baseline iphoneos SDK version: **$(xcrun --sdk iphoneos --show-sdk-version)**"
            echo "- Duo SDK headers (>= 27.1): **$([ $DUO_SDK = 1 ] && echo YES || echo NO)** -> Duo lane $([ $DUO_SDK = 1 ] && echo "RUNS on $(basename "$DUO_XCODE")" || echo SKIPPED)"
            echo "- Duo simulator device type present: **$([ $DUO_SIM = 1 ] && echo YES || echo NO)**"
            echo "- A green run with the Duo lane skipped is the baseline recorder only; it proves nothing about the Duo path."
          } | tee -a "$GITHUB_STEP_SUMMARY"
          echo "DUO_SDK=$DUO_SDK" >> "$GITHUB_ENV"
          echo "DUO_SIM=$DUO_SIM" >> "$GITHUB_ENV"

      - name: Install XcodeGen
        run: |
          curl -sL https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip -o /tmp/xcodegen.zip
          unzip -q /tmp/xcodegen.zip -d /tmp/xcodegen
          XCODEGEN_BIN=$(find /tmp/xcodegen -name "xcodegen" -type f | head -1)
          sudo cp "$XCODEGEN_BIN" /usr/local/bin/xcodegen
          sudo chmod +x /usr/local/bin/xcodegen
          xcodegen --version

      - name: Generate Xcode project
        run: xcodegen generate

      # Evidence, not decoration: the step fails if a target does not report its conditions.
      - name: Show compilation conditions per target (baseline lane)
        run: |
          set -o pipefail
          for t in StoryCue StoryCueTests StoryCueDuoTests; do
            echo "== $t =="
            xcodebuild -showBuildSettings -project StoryCue.xcodeproj -target "$t" -configuration Debug \
              STORYCUE_DUO_CONDITIONS="" | grep -E 'SWIFT_ACTIVE_COMPILATION_CONDITIONS|STORYCUE_DUO_CONDITIONS'
          done

      # Baseline lane always runs: flag off, so this is the app every iPhone gets today.
      - name: Build & test (baseline, flag off)
        run: |
          set -o pipefail
          xcodebuild test \
            -project StoryCue.xcodeproj \
            -scheme StoryCue \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            -configuration Debug \
            -resultBundlePath "$RUNNER_TEMP/baseline.xcresult" \
            STORYCUE_DUO_CONDITIONS="" \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            | xcbeautify

      # Duo lane runs only when the gate found 27.1 headers. Same project, same scheme,
      # flag on; the StoryCueDuoTests bundle gets the flag, StoryCueTests never does.
      # It compiles everything with the flag on, but runs only StoryCueDuoTests: the
      # StoryCueTests bundle never sees the flag, so re-running it here repeated the
      # baseline lane test for test.
      - name: Build & test (Duo, flag on)
        if: env.DUO_SDK == '1'
        run: |
          set -o pipefail
          export DEVELOPER_DIR="$DUO_XCODE/Contents/Developer"
          echo "Using: $DUO_XCODE"
          xcodebuild -version
          for t in StoryCue StoryCueTests StoryCueDuoTests; do
            echo "== $t =="
            xcodebuild -showBuildSettings -project StoryCue.xcodeproj -target "$t" -configuration Debug \
              STORYCUE_DUO_CONDITIONS="DUO_SDK" | grep -E 'SWIFT_ACTIVE_COMPILATION_CONDITIONS'
          done
          xcodebuild test \
            -project StoryCue.xcodeproj \
            -scheme StoryCue \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            -configuration Debug \
            -only-testing:StoryCueDuoTests \
            -resultBundlePath "$RUNNER_TEMP/duo.xcresult" \
            STORYCUE_DUO_CONDITIONS="DUO_SDK" \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            | xcbeautify

      # Debug-only CI can't see Release-only breakage (e.g. a non-DEBUG caller of the
      # #if DEBUG MockCaptureService). Unsigned Release compile with the allowlisted Xcode.
      - name: Release compile (unsigned, device SDK)
        run: |
          set -o pipefail
          xcodebuild build \
            -project StoryCue.xcodeproj \
            -scheme StoryCue \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            | xcbeautify

      - name: Upload xcresult bundles
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcresult-${{ github.run_number }}
          path: ${{ runner.temp }}/*.xcresult
          if-no-files-found: ignore
          retention-days: 14
